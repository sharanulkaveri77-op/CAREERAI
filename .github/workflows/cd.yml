name: CD · Production Deploy

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

# Runs the deploy steps only when secrets.VERCEL_TOKEN exists (see README → CI/CD Pipeline).
# The token check lives at STEP level because `secrets` is unavailable in job-level `if`.
env:
  VERCEL_ORG_ID: team_SCHJ4axXjcFefinXX1Gwybbc

jobs:
  deploy-api:
    name: Deploy API · careerai-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_kGAkPkSxp59waXTMuSow2iCzkuDL
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Skip when VERCEL_TOKEN not configured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN not set — deploy skipped (see README → CI/CD Pipeline)"

      - name: Pull production environment
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=production

      - name: Build (serverless)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel build --prod

      - name: Deploy to production
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel deploy --prebuilt --prod --yes

  deploy-web:
    name: Deploy Frontend · careerai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_xgoVLet3RGcis5lcxsUJCmyMMRKT
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Skip when VERCEL_TOKEN not configured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN not set — deploy skipped (see README → CI/CD Pipeline)"

      - name: Pull production environment
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=production

      - name: Build (SPA)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel build --prod

      - name: Deploy to production
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel deploy --prebuilt --prod --yes
